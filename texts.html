<!DOCTYPE html>

<body>

  <header>
    <a href="index.html" class="site-name">Raúl Hilario Montes</a>
    <nav>
      <a href="projects.html">Projects</a>
      <a href="texts.html" class="active">Texts</a>
      <a href="cv.html">CV</a>
      <a href="info.html">Info</a>
    </nav>
  </header>

  <main>
    <div class="texts-index" id="textsIndex">

      <!-- ═══════════════════════════════════════════════════
           PLANTILLA PARA AÑADIR TEXTOS
           Copia este bloque y rellena los datos.
           El orden se actualiza solo por año (más reciente arriba).

           data-year   → año del texto (para ordenar)
           href        → pon la URL del PDF o el nombre del archivo HTML interno
           target      → pon target="_blank" si es PDF o enlace externo, elimínalo si es página interna

           Estructura:
           <a class="text-row" href="..." data-year="XXXX">
             <span class="text-row-main">Título del texto. Autor del texto</span>
             <span class="text-row-meta">Nombre del proyecto / exposición — XXXX</span>
           </a>
      ═══════════════════════════════════════════════════ -->

      <a class="text-row" href="texts/texto-ejemplo.html" data-year="2024">
        <span class="text-row-main">Título del texto. Autor del texto</span>
        <span class="text-row-meta">Nombre del proyecto — 2024</span>
      </a>

      <a class="text-row" href="texts/otro-texto.pdf" target="_blank" data-year="2022">
        <span class="text-row-main">Otro texto. Otro autor</span>
        <span class="text-row-meta">Nombre del proyecto — 2022</span>
      </a>

      <a class="text-row" href="texts/texto-antiguo.html" data-year="2021">
        <span class="text-row-main">Texto más antiguo. Autor</span>
        <span class="text-row-meta">Nombre del proyecto — 2021</span>
      </a>

    </div>
  </main>

  <footer>
    <span>© 2025 Raúl Hilario Montes</span>
  </footer>

  <script>
    // Ordena automáticamente por año, más reciente arriba
    const index = document.getElementById('textsIndex');
    const rows = Array.from(index.querySelectorAll('.text-row'));
    rows.sort((a, b) => parseInt(b.dataset.year) - parseInt(a.dataset.year));
    rows.forEach(r => index.appendChild(r));
  </script>

</body>
