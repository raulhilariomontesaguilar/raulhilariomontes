  <script>
    document.querySelectorAll('.project-slideshow').forEach(function(ss) {
      const slides = Array.from(ss.querySelectorAll('.pslide'));
      const total = slides.length;
      let current = 0;
      let blocked = false;
      let paused = false;
      const counterCurrent = ss.querySelector('.pslide-current');
      const counterTotal   = ss.querySelector('.pslide-total');
      if (counterTotal) counterTotal.textContent = total;

      function goTo(n) {
        slides[current].classList.remove('active');
        current = (n + total) % total;
        slides[current].classList.add('active');
        if (counterCurrent) counterCurrent.textContent = current + 1;
      }

      const nextBtn = ss.querySelector('.pslide-next');
      const prevBtn = ss.querySelector('.pslide-prev');
      if (nextBtn) nextBtn.addEventListener('click', () => goTo(current + 1));
      if (prevBtn) prevBtn.addEventListener('click', () => goTo(current - 1));

      // Autoavance: primera imagen más larga
      let timer;
      function scheduleNext() {
        clearTimeout(timer);
        const delay = current === 0 ? 8000 : 6000;
        timer = setTimeout(function() {
          if (!paused) { goTo(current + 1); scheduleNext(); }
          else { scheduleNext(); }
        }, delay);
      }
      scheduleNext();

      // Pausa con ratón (desktop)
      ss.addEventListener('mouseenter', () => { paused = true; });
      ss.addEventListener('mouseleave', () => { paused = false; });

      // Trackpad horizontal
      ss.addEventListener('wheel', e => {
        if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
        e.preventDefault();
        if (blocked) return;
        blocked = true;
        goTo(e.deltaX > 0 ? current + 1 : current - 1);
        setTimeout(() => { blocked = false; }, 700);
      }, { passive: false });

      // Touch móvil: pausa al mantener, swipe para cambiar
      let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
      ss.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
        paused = true;
      }, {passive: true});
      ss.addEventListener('touchend', e => {
        paused = false;
        const diffX = touchStartX - e.changedTouches[0].clientX;
        const diffY = touchStartY - e.changedTouches[0].clientY;
        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 30) {
          goTo(diffX > 0 ? current + 1 : current - 1);
        }
      }, {passive: true});
    });
  </script>
