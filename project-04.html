    <article class="project-single">

    <div class="project-body">

        <span class="project-context"></span>
        <span class="year">2021</span>

        </div>
      </div>

      <!-- Añade un <div class="pslide"> por cada imagen -->
      <div class="project-slideshow">
        <div class="pslide active">
          <img src="images/nuevapertura3.png" alt="">
        </div>
        <div class="pslide">
          <img src="images/nuevaaperturagrande.png" alt="">
        </div>
        <div class="pslide">
          <img src="images/detallecartel.png" alt="">
        </div>
        <div class="pslide">
          <img src="images/rompiendo2.png" alt="">
        </div>
        <div class="pslide">

        <div class="pslide">

        <button class="pslide-prev" aria-label="Anterior">&#8592;</button>
        <button class="pslide-next" aria-label="Siguiente">&#8594;</button>
        <div class="pslide-counter">
          <span class="pslide-current">1</span> / <span class="pslide-total"></span>
        </div>
      </div>

  <footer>
    <span>© 2025 Raúl Hilario Montes</span>
  </footer>

  <script>
    const imageSlides = Array.from(document.querySelectorAll('.project-slideshow .pslide'));
    const total = imageSlides.length;
    let current = 0;
    const counterCurrent = document.querySelector('.pslide-current');
    const counterTotal   = document.querySelector('.pslide-total');
    counterTotal.textContent = total;
    function goTo(n) {
      imageSlides[current].classList.remove('active');
      current = (n + total) % total;
      imageSlides[current].classList.add('active');
      counterCurrent.textContent = current + 1;
    }
    document.querySelector('.pslide-next').addEventListener('click', () => goTo(current + 1));
    document.querySelector('.pslide-prev').addEventListener('click', () => goTo(current - 1));
    setInterval(() => goTo(current + 1), 6000);
    let touchStartX = 0;
    const ss = document.querySelector('.project-slideshow');
    ss.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
    ss.addEventListener('touchend', e => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) goTo(diff > 0 ? current + 1 : current - 1);
    });
  </script>

</body>
</html>
