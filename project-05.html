  <style>
    .book-viewer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0 0 3rem 0;
    }

    .book-stage {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .book-pages {
      position: relative;
      width: 100%;
      background: #fff;
      box-shadow: 0 4px 40px rgba(0,0,0,0.12);
      overflow: hidden;
      min-height: 100px;
      line-height: 0;
    }

    /* Vista: puede ser simple o doble */
    .book-view {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      opacity: 0 !important;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: translateX(4%) scale(0.98);
      display: flex;
    }

    .book-view.active {
      position: relative !important;
      opacity: 1 !important;
      pointer-events: auto;
      transform: translateX(0) scale(1);
    }

    .book-view.leaving {
      position: absolute !important;
      opacity: 0 !important;
      transform: translateX(-4%) scale(0.98);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* Página simple (portada/contraportada) */
    .book-view.single img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Pliego doble */
    .book-view.double img {
      display: block;
      width: 50%;
      height: auto;
      flex-shrink: 0;
    }

    /* Lomo central solo en dobles */
    .book-view.double::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 100%;
      background: linear-gradient(to right,
        rgba(0,0,0,0.04),
        rgba(0,0,0,0.10),
        rgba(0,0,0,0.04));
      pointer-events: none;
      z-index: 2;
    }

    /* Controles */
    .book-controls {
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-top: 1rem;
    }

    .book-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.72rem;
      color: var(--color-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: var(--font);
      transition: color 0.15s;
      padding: 0.5rem;
    }

    .book-btn:hover { color: var(--color-text); }
    .book-btn:disabled { opacity: 0.2; cursor: default; }

    .book-counter {
      font-size: 0.68rem;
      color: var(--color-muted);
      letter-spacing: 0.08em;
      min-width: 4rem;
      text-align: center;
    }

    @media (max-width: 640px) {
      .book-view.double img {
        width: 50%;
      }
      .book-view.double::after {
        display: none;
      }
    }
  </style>

<body>

    <article class="project-single">
      <div class="project-header">
        <h1>Cómo escribí este poema y dónde está Cumpián</h1>

    <div class="project-body" style="margin-bottom: 1.5rem;">
      <div class="project-info">

    <div class="book-viewer">
      <div class="book-stage">
        <div class="book-pages" id="bookPages"></div>
      </div>
      <div class="book-controls">
        <button class="book-btn" id="btnPrev">&#8592; Anterior</button>
        <span class="book-counter" id="bookCounter"></span>
        <button class="book-btn" id="btnNext">Siguiente &#8594;</button>
      </div>
    </div>

  </main>

  <footer><span>© 2025 Raúl Hilario Montes</span></footer>

  <script>
    // Definición de vistas
    const views = [
      { type: 'double', imgs: ['images/poema2.png',  'images/poema.png'] },   // primera vista
      { type: 'double', imgs: ['images/poema2.png',  'images/poema3.png'] },
      { type: 'double', imgs: ['images/poema4.png',  'images/poema5.png'] },
      { type: 'double', imgs: ['images/poema6.png',  'images/poema7.png'] },
      { type: 'double', imgs: ['images/poema8.png',  'images/poema9.png'] },
      { type: 'double', imgs: ['images/poema10.png', 'images/poema11.png'] },
      { type: 'double', imgs: ['images/poema12.png', 'images/poema13.png'] },
      { type: 'double', imgs: ['images/poema14.png', 'images/poema15.png'] },
      { type: 'double', imgs: ['images/poema16.png', 'images/poema17.png'] },
      { type: 'double', imgs: ['images/poema18.png', 'images/poema19.png'] },
      { type: 'double', imgs: ['images/poema20.png', 'images/poema21.png'] },
      { type: 'double', imgs: ['images/poema22.png', 'images/poema23.png'] },
      { type: 'double', imgs: ['images/poema24.png', 'images/poema25.png'] },
      { type: 'double', imgs: ['images/poema26.png', 'images/poema27.png'] },
      { type: 'double', imgs: ['images/poema28.png', 'images/poema29.png'] },
      { type: 'double', imgs: ['images/poema30.png', 'images/poema31.png'] },
      { type: 'double', imgs: ['images/poema32.png', 'images/poema33.png'] },
      { type: 'double', imgs: ['images/poema34.png', 'images/poema35.png'] },
      { type: 'double', imgs: ['images/poema36.png', 'images/poema37.png'] },
    ];

    const container = document.getElementById('bookPages');
    const counter   = document.getElementById('bookCounter');
    const btnPrev   = document.getElementById('btnPrev');
    const btnNext   = document.getElementById('btnNext');
    const total     = views.length;
    let current     = 0;
    const viewEls   = {};

    function updateUI() {
      counter.textContent = (current + 1) + ' / ' + total;
      btnPrev.disabled = current === 0;
      btnNext.disabled = false;
    }

    function createView(index) {
      if (viewEls[index]) return;
      const v = views[index];
      const div = document.createElement('div');
      div.className = 'book-view ' + v.type;
      div.dataset.index = index;

      v.imgs.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = '';
        div.appendChild(img);
      });

      container.appendChild(div);
      viewEls[index] = div;
    }

    function showView(index, direction) {
      createView(index);
      if (index + 1 < total) createView(index + 1);
      if (index - 1 >= 0) createView(index - 1);

      const prev = viewEls[current];
      if (prev && current !== index) {
        prev.classList.remove('active');
        prev.classList.add('leaving');
        setTimeout(() => { if (prev) prev.classList.remove('leaving'); }, 400);
      }

      const next = viewEls[index];
      next.style.transform = direction === 'next'
        ? 'translateX(4%) scale(0.98)'
        : 'translateX(-4%) scale(0.98)';
      next.style.opacity = '0';
      next.style.position = 'absolute';

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          next.classList.add('active');
        });
      });

      current = index;
      updateUI();
    }

    // Init
    createView(0);
    createView(1);
    viewEls[0].classList.add('active');
    updateUI();

    btnNext.addEventListener('click', () => {
      if (current < total - 1) showView(current + 1, 'next');
      else showView(0, 'next'); // vuelve al inicio
    });
    btnPrev.addEventListener('click', () => {
      if (current > 0) showView(current - 1, 'prev');
    });

    // Trackpad
    let wheelBlocked = false;
    container.addEventListener('wheel', e => {
      if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
      e.preventDefault();
      if (wheelBlocked) return;
      wheelBlocked = true;
      if (e.deltaX > 0) showView(current < total - 1 ? current + 1 : 0, 'next');
      if (e.deltaX < 0 && current > 0) showView(current - 1, 'prev');
      setTimeout(() => { wheelBlocked = false; }, 600);
    }, { passive: false });

    // Touch
    let tx = 0, ty = 0;
    container.addEventListener('touchstart', e => {
      tx = e.touches[0].clientX;
      ty = e.touches[0].clientY;
    }, { passive: true });
    container.addEventListener('touchend', e => {
      const dx = tx - e.changedTouches[0].clientX;
      const dy = ty - e.changedTouches[0].clientY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        if (dx > 0) showView(current < total - 1 ? current + 1 : 0, 'next');
        if (dx < 0 && current > 0) showView(current - 1, 'prev');
      }
    }, { passive: true });

    // Teclado
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') showView(current < total - 1 ? current + 1 : 0, 'next');
      if (e.key === 'ArrowLeft' && current > 0) showView(current - 1, 'prev');
    });
  </script>
