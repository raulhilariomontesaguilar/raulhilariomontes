<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cómo escribí este poemario y dónde está Cumpiáns</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Visor de libro ── */
    .book-viewer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0 0 3rem 0;
    }

    .book-stage {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .book-pages {
      position: relative;
      width: 100%;
      background: #fff;
      box-shadow: 0 2px 40px rgba(0,0,0,0.10);
      overflow: hidden;
    }

    .book-page {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .book-page.active {
      position: relative;
      opacity: 1;
      pointer-events: auto;
    }

    .book-page canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
    }

    /* Sombra central simulando el lomo del libro */
    .book-spine {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.08), rgba(0,0,0,0.03), rgba(0,0,0,0.08));
      pointer-events: none;
      z-index: 2;
    }

    /* Controles */
    .book-controls {
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-top: 1.2rem;
    }

    .book-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--color-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: var(--font);
      transition: color 0.15s;
      padding: 0.5rem;
    }

    .book-btn:hover { color: var(--color-text); }
    .book-btn:disabled { opacity: 0.2; cursor: default; }

    .book-counter {
      font-size: var(--meta-size);
      color: var(--color-muted);
      letter-spacing: 0.08em;
      min-width: 5rem;
      text-align: center;
    }

    /* Loading */
    .book-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 400px;
      font-size: var(--meta-size);
      color: var(--color-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Móvil */
    @media (max-width: 640px) {
      .book-stage {
        max-width: 100%;
      }
      .book-spine {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="site-name">Raúl Hilario Montes</a>
    <nav>
      <a href="projects.html" class="active">Projects</a>
      <a href="texts.html">Texts</a>
      <a href="cv.html">CV</a>
      <a href="info.html">Info</a>
    </nav>
  </header>

  <main>
    <a href="projects.html" class="back-link">← Projects</a>

    <article class="project-single">
      <div class="project-header">
        <h1>Cómo escribí este poemario y dónde está Cumpián</h1>
      </div>
    </article>

    <div class="project-body" style="margin-bottom: 2rem;">
      <div class="project-info">
        <span class="project-context">Pamfletografía de lo caduco, Málaga</span>
        <span class="year">2021</span>
        <div class="project-text">
          <p>Poemario. Papel continuo impreso.</p>
        </div>
      </div>
    </div>

    <!-- Visor de libro -->
    <div class="book-viewer">
      <div class="book-stage">
        <div class="book-pages" id="bookPages">
          <div class="book-loading" id="bookLoading">Cargando...</div>
          <div class="book-spine" id="bookSpine" style="display:none"></div>
        </div>
      </div>

      <div class="book-controls">
        <button class="book-btn" id="btnPrev">&#8592; Anterior</button>
        <span class="book-counter" id="bookCounter"></span>
        <button class="book-btn" id="btnNext">Siguiente &#8594;</button>
      </div>
    </div>

  </main>

  <footer>
    <span>© 2025 Raúl Hilario Montes</span>
  </footer>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const PDF_URL = 'images/poemario.pdf';
    const container = document.getElementById('bookPages');
    const loading   = document.getElementById('bookLoading');
    const spine     = document.getElementById('bookSpine');
    const counter   = document.getElementById('bookCounter');
    const btnPrev   = document.getElementById('btnPrev');
    const btnNext   = document.getElementById('btnNext');

    let pages = [];
    let current = 0;
    let totalPages = 0;
    let rendering = false;
    const rendered = {};

    function updateUI() {
      counter.textContent = (current + 1) + ' / ' + totalPages;
      btnPrev.disabled = current === 0;
      btnNext.disabled = current === totalPages - 1;
    }

    async function renderPage(index) {
      if (rendered[index]) return;
      rendered[index] = true;

      const page = await pages[index];
      const scale = 2; // alta resolución
      const viewport = page.getViewport({ scale });

      const div = document.createElement('div');
      div.className = 'book-page';
      div.dataset.index = index;

      const canvas = document.createElement('canvas');
      canvas.width  = viewport.width;
      canvas.height = viewport.height;

      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;

      div.appendChild(canvas);
      container.appendChild(div);

      if (index === 0) {
        div.classList.add('active');
        loading.style.display = 'none';
        spine.style.display = 'block';
        updateUI();
      }
    }

    async function showPage(index) {
      if (rendering) return;
      rendering = true;

      // Renderiza la página pedida y la siguiente (precarga)
      await renderPage(index);
      if (index + 1 < totalPages) renderPage(index + 1);

      // Transición
      const allPages = container.querySelectorAll('.book-page');
      allPages.forEach(p => p.classList.remove('active'));
      const target = container.querySelector(`[data-index="${index}"]`);
      if (target) target.classList.add('active');

      current = index;
      updateUI();
      rendering = false;
    }

    async function init() {
      try {
        const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
        totalPages = pdf.numPages;

        // Guarda promesas de páginas
        for (let i = 0; i < totalPages; i++) {
          pages.push(pdf.getPage(i + 1));
        }

        await showPage(0);
      } catch(e) {
        loading.textContent = 'No se ha podido cargar el PDF.';
        console.error(e);
      }
    }

    btnNext.addEventListener('click', () => {
      if (current < totalPages - 1) showPage(current + 1);
    });

    btnPrev.addEventListener('click', () => {
      if (current > 0) showPage(current - 1);
    });

    // Trackpad
    let wheelBlocked = false;
    container.addEventListener('wheel', e => {
      if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
      e.preventDefault();
      if (wheelBlocked) return;
      wheelBlocked = true;
      if (e.deltaX > 0 && current < totalPages - 1) showPage(current + 1);
      if (e.deltaX < 0 && current > 0) showPage(current - 1);
      setTimeout(() => { wheelBlocked = false; }, 600);
    }, { passive: false });

    // Touch móvil
    let tx = 0, ty = 0;
    container.addEventListener('touchstart', e => {
      tx = e.touches[0].clientX;
      ty = e.touches[0].clientY;
    }, { passive: true });
    container.addEventListener('touchend', e => {
      const dx = tx - e.changedTouches[0].clientX;
      const dy = ty - e.changedTouches[0].clientY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        if (dx > 0 && current < totalPages - 1) showPage(current + 1);
        if (dx < 0 && current > 0) showPage(current - 1);
      }
    }, { passive: true });

    // Teclado
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' && current < totalPages - 1) showPage(current + 1);
      if (e.key === 'ArrowLeft'  && current > 0) showPage(current - 1);
    });

    init();
  </script>

</body>
</html>
